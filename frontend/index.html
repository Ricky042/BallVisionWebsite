
<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>BallVision AI - Systems Initialization</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#f27f0d",
            "background-light": "#f8f7f5",
            "background-dark": "#0a0c10",
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"]
          }
        },
      },
    }
  </script>
  <style type="text/tailwindcss">
    @layer base {
      body {
        @apply bg-background-dark text-white font-display antialiased;
      }
    }
    @layer components {
      .glass-panel {
        @apply bg-white/[0.03] backdrop-blur-xl border border-white/[0.08];
      }
      .court-lines {
        background-image: 
          linear-gradient(rgba(242, 127, 13, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(242, 127, 13, 0.05) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      .glow-pulse {
        box-shadow: 0 0 20px rgba(242, 127, 13, 0.2);
      }
      .radar-line {
        stroke-dasharray: 100;
        stroke-dashoffset: 0;
      }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background-dark overflow-x-hidden">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
